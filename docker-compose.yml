name: 9router

networks:
  9router-net:
    driver: bridge

services:
  9router:
    build: ./src/9router
    container_name: 9router
    profiles: ["dashboard"]
    restart: unless-stopped
    env_file: ./env/9router.env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    volumes:
      - ./data/9router:/app/data
      - ./data-home/9router-home:/app/data-home
    networks: [9router-net]
    depends_on:
      headroom: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20128/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  headroom:
    build:
      context: ./src/9router-api
      dockerfile: Dockerfile
    container_name: headroom
    entrypoint: ["setpriv", "--reuid=node", "--regid=node", "--init-groups", "/opt/headroom-venv/bin/headroom"]
    command: ["proxy", "--host", "0.0.0.0", "--port", "8787"]
    restart: unless-stopped
    networks: [9router-net]
    environment:
      HOME: /home/node
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      HEADROOM_OUTPUT_SHAPER: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  9router-api:
    build:
      context: ./src/9router-api
      dockerfile: Dockerfile
    container_name: 9router-api
    restart: unless-stopped
    env_file: ./env/9router-api.env
    environment:
      PORT: "20127"
      NODE_ENV: production
      NINEROUTER_HOME: /app/9router
    volumes:
      - ./data/9router:/app/data
      - ./data-home/9router-home:/app/data-home
    networks: [9router-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20127/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    env_file: ./env/caddy.env
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [9router-net]
    depends_on:
      9router-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pgrep", "caddy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    env_file: ./env/cloudflared.env
    command: tunnel --no-autoupdate run
    networks: [9router-net]
    depends_on:
      caddy: { condition: service_healthy }