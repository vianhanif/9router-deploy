name: deploy

on:
  push:
    branches: [ master ]
    paths:
      - 'docker-compose.yml'
      - 'proxy/Caddyfile'
      - 'src/**'
      - 'cloudflared/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      ninerouter_branch:
        description: "9router branch, tag, or 40-char SHA. Blank = the pinned release (see PIN_9ROUTER)."
        required: false
      api_branch:
        description: "9router-api branch, tag, or 40-char SHA. Blank = the pinned release (see PIN_9ROUTER_API)."
        required: false
  repository_dispatch:
    types: [ deploy ]

concurrency:
  group: deploy-9router
  cancel-in-progress: false

# GHCR push requires explicit opt-in: the repo default workflow-token
# permission is `read`, so without this block the push 403s.
# Build cache: we only READ (`cache-from: type=gha`). `cache-to: type=gha,mode=max`
# was removed after it failed with `error writing layer blob: not_found` at
# 7.4GB/10GB quota pressure (eviction race mid-export). Builds are ~8 min cold;
# export isn't worth the failure mode. Reading a cache needs no scope, so
# `actions: write` is NOT requested — least privilege: contents + packages only.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMG_9ROUTER: ghcr.io/${{ github.repository_owner }}/9router-deploy/9router
      IMG_9ROUTER_API: ghcr.io/${{ github.repository_owner }}/9router-deploy/9router-api
      # ── Production pin ──────────────────────────────────────────────────
      # The default deploy target. Advances ONLY when these change in a
      # reviewed PR, or when a dispatch passes an explicit ref.
      #
      # Why a tag and not `master`: both source repos are separate, so a merge
      # landing in either one was shipping to prod on the next deploy of the
      # *other* repo. The pin decouples "merge code" from "ship code".
      #
      # Bumping: cut a new tag in the source repo, then update the value here.
      # Never move an existing tag forward — that rewrites what a prior deploy
      # shipped. Both repos must be tagged; resolve_sha fails loudly otherwise.
      PIN_9ROUTER: v0.5.104
      PIN_9ROUTER_API: v0.5.104

    steps:
      - uses: actions/checkout@v7

      # Source SHAs resolve on the runner (git ls-remote), not over SSH on the
      # VPS — the image build itself also moved off the VPS with this change.
      - name: Resolve source SHAs
        id: resolve
        env:
          INPUT_NINEROUTER: ${{ github.event.inputs.ninerouter_branch }}
          INPUT_API: ${{ github.event.inputs.api_branch }}
        run: |
          set -euo pipefail

          # repository_dispatch carries no `inputs`, so both may be empty —
          # blank means "deploy the pinned release", not "deploy master".
          NINEROUTER_TARGET="${INPUT_NINEROUTER:-$PIN_9ROUTER}"
          API_TARGET="${INPUT_API:-$PIN_9ROUTER_API}"

          resolve_sha() {
            local ref="$1" repo="$2" sha
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$ref"
              return
            fi
            # Branch wins over tag when both share a name (previous behaviour).
            sha=$(git ls-remote "$repo" refs/heads/"$ref" 2>/dev/null | cut -f1)
            # Tag: an annotated tag resolves to the tag OBJECT, which the image
            # build cannot check out, so peel it (`^{}`) to the commit first.
            if [[ -z "$sha" ]]; then
              sha=$(git ls-remote "$repo" "refs/tags/$ref^{}" 2>/dev/null | cut -f1)
            fi
            if [[ -z "$sha" ]]; then
              sha=$(git ls-remote "$repo" "refs/tags/$ref" 2>/dev/null | cut -f1)
            fi
            if [[ -z "$sha" ]]; then
              echo "ERROR: cannot resolve ref '$ref' in $repo" >&2
              exit 1
            fi
            echo "$sha"
          }

          NINEROUTER_SHA=$(resolve_sha "$NINEROUTER_TARGET" "https://github.com/vianhanif/9router.git")
          APIREPO_SHA=$(resolve_sha "$API_TARGET" "https://github.com/vianhanif/9router-api.git")

          echo "Deploying: 9router=$NINEROUTER_TARGET ($NINEROUTER_SHA), 9router-api=$API_TARGET ($APIREPO_SHA)"

          echo "ninerouter_sha=$NINEROUTER_SHA" >> "$GITHUB_OUTPUT"
          echo "apirepo_sha=$APIREPO_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The runner build/push MUST authenticate explicitly: `packages: write`
      # alone leaves the registry token exchange anonymous, which 403s.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds run on the GitHub runner: 2 vCPU/7 GB instead of the 1.7 GB VPS,
      # and they no longer serialize behind the 30–60 m SSH timeouts the on-VPS
      # build used to hit. Runner BuildKit cache is bounded by GHA cache itself
      # (type=gha,mode=max); the VPS-side 3G builder-prune cap still applies to
      # the VPS-local builds that preview.yml and manual rebuilds perform.
      - name: Build & push 9router
        uses: docker/build-push-action@v7
        with:
          context: src/9router
          push: true
          tags: |
            ${{ env.IMG_9ROUTER }}:sha-${{ steps.resolve.outputs.ninerouter_sha }}
            ${{ env.IMG_9ROUTER }}:latest
          build-args: |
            NINEROUTER_VERSION=${{ steps.resolve.outputs.ninerouter_sha }}
          cache-from: type=gha

      - name: Build & push 9router-api
        uses: docker/build-push-action@v7
        with:
          context: src/9router-api
          push: true
          tags: |
            ${{ env.IMG_9ROUTER_API }}:sha-${{ steps.resolve.outputs.apirepo_sha }}
            ${{ env.IMG_9ROUTER_API }}:latest
          build-args: |
            NINEROUTER_VERSION=${{ steps.resolve.outputs.ninerouter_sha }}
            APIREPO_VERSION=${{ steps.resolve.outputs.apirepo_sha }}
          cache-from: type=gha

      - name: Sync deploy config
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          source: "docker-compose.yml,proxy/Caddyfile,src/9router/Dockerfile,src/9router-api/Dockerfile"
          target: /opt/9router

      # The GHCR packages are public, so this login is not strictly required —
      # anonymous pulls work. It is kept as a fallback so the VPS still deploys
      # if visibility is ever flipped to private, and it fails loudly when
      # GHCR_PULL_TOKEN is empty rather than silently relying on anonymity.
      #
      # Ordering matters: the VPS must be authenticated before ANY pull, the
      # smoke test's implicit pull of the SHA-tagged refs included. The login
      # persists in /root/.docker/config.json on the VPS for the later
      # ssh-action steps of this job (each step is a separate connection, so the
      # credential cannot be scoped to one step without re-logging in each time).
      # `docker logout` runs as the final step of this job.
      - name: Login to GHCR on VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          envs: GHCR_PULL_TOKEN
          script: |
            set -e
            if [ -z "${GHCR_PULL_TOKEN}" ]; then
              echo "ERROR: secret GHCR_PULL_TOKEN is empty — create it (classic PAT, read:packages)"
              exit 1
            fi
            echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io \
              -u "${{ github.repository_owner }}" --password-stdin

      - name: Smoke test new images
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/9router

            # Dynamic string mapping to block the runner character stripping sequence
            LOCAL_HOST="127.0.0.1"
            DASHBOARD_URL="http://${LOCAL_HOST}:20328/api/health"
            API_URL="http://${LOCAL_HOST}:20327/api/health"
            RESP_URL="http://${LOCAL_HOST}:20327/v1/responses"

            cleanup() {
              echo "Cleaning up smoke test containers..."
              docker rm -f smoke-9router smoke-api >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            echo "Starting isolated stack for smoke validation..."

            # Smoke the SHA-tagged refs, NOT `:latest`: the implicit pull on
            # `docker run` would otherwise overwrite the local `:latest` that the
            # switch step is about to capture as `:prev` for rollback.
            # 1. Start Dashboard with exact configuration parameters.
            #    Ports bind to 127.0.0.1 only so the throwaway instance is never
            #    exposed on the VPS public interface.
            docker run -d --name smoke-9router --network 9router_9router-net \
              --env-file ./env/9router.env -e PORT=20328 \
              -p 127.0.0.1:20328:20328 \
              -v /opt/9router/data/9router:/app/data -v /opt/9router/data-home/9router-home:/app/data-home \
              ${{ env.IMG_9ROUTER }}:sha-${{ steps.resolve.outputs.ninerouter_sha }}

            echo "Awaiting dashboard boot up at ${DASHBOARD_URL}..."
            for i in $(seq 1 20); do
              curl -fsS "$DASHBOARD_URL" >/dev/null 2>&1 && break || true
              sleep 3
            done

            curl -fsS "$DASHBOARD_URL" >/dev/null || {
              echo "ERROR: 9router dashboard smoke test failed"
              docker logs smoke-9router || true
              exit 1
            }

            # 3. Start API using identical environment settings
            docker run -d --name smoke-api --network 9router_9router-net \
              --env-file ./env/9router-api.env -e PORT=20327 \
              -p 127.0.0.1:20327:20327 \
              -v /opt/9router/data/9router:/app/data -v /opt/9router/data-home/9router-home:/app/data-home \
              ${{ env.IMG_9ROUTER_API }}:sha-${{ steps.resolve.outputs.apirepo_sha }}

            echo "Awaiting api gateway boot up at ${API_URL}..."
            for i in $(seq 1 20); do
              curl -fsS "$API_URL" >/dev/null 2>&1 && break || true
              sleep 3
            done

            curl -fsS "$API_URL" >/dev/null || {
              echo "ERROR: 9router-api smoke test failed"
              docker logs smoke-api || true
              exit 1
            }

            # Verify endpoint behavior explicitly
            RESP_BODY=$(curl -s -X POST "$RESP_URL" \
              -H "Content-Type: application/json" \
              -d '{"model":"general","input":"ping"}')

            echo "smoke /v1/responses output tail: $(echo "$RESP_BODY" | head -c 200)"

            if echo "$RESP_BODY" | grep -q "Cannot POST"; then
              echo "ERROR: /v1/responses route is missing or broken"
              exit 1
            fi

            echo "SMOKE TEST PASSED SUCCESSFULLY"

      - name: Switch to new images & verify
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/9router

            # Capture the currently-running images as `:prev` BEFORE pulling, so
            # a failed switch can roll back from local images with NO registry
            # access. (Smoke used SHA-tagged refs, so local `:latest` is still
            # the old image.) On the very first post-cutover deploy the ghcr
            # `:latest` tag does not exist locally yet — fall back to the image
            # the production container actually runs (pre-cutover compose-built
            # name), so rollback works from day one.
            capture_prev() {
              local svc="$1" ref="$2" img
              if docker image inspect "$ref:latest" >/dev/null 2>&1; then
                img="$ref:latest"
              else
                img=$(docker inspect -f '{{.Config.Image}}' "$svc" 2>/dev/null || true)
              fi
              if [ -n "$img" ] && docker image inspect "$img" >/dev/null 2>&1; then
                docker tag "$img" "$ref:prev"
                echo "captured $img -> $ref:prev"
              else
                echo "WARN: nothing to capture as $ref:prev (fresh VPS?)"
              fi
            }
            capture_prev 9router "${{ env.IMG_9ROUTER }}"
            capture_prev 9router-api "${{ env.IMG_9ROUTER_API }}"

            echo "Pulling new images from GHCR..."
            # 9router is profile-gated, so a bare `pull` would skip it; list the
            # services explicitly and activate the profile.
            docker compose --profile dashboard pull 9router 9router-api headroom

            echo "Starting production stack..."

            docker compose --profile dashboard up -d \
              --remove-orphans \
              --force-recreate

            echo
            echo "Container status:"
            docker compose ps

            echo
            echo "Checking required services..."

            test "$(docker inspect -f '{{.State.Running}}' 9router-api)" = "true" || {
              echo "ERROR: 9router-api is not running"
              docker logs --tail=100 9router-api || true
              exit 1
            }

            test "$(docker inspect -f '{{.State.Running}}' caddy)" = "true" || {
              echo "ERROR: caddy is not running"
              docker logs --tail=100 caddy || true
              exit 1
            }

            test "$(docker inspect -f '{{.State.Running}}' cloudflared)" = "true" || {
              echo "ERROR: cloudflared is not running"
              docker logs --tail=100 cloudflared || true
              exit 1
            }

            # Verify production 9router-api from inside the container.
            # Port 20127 is intentionally not published to the VPS host.
            echo "Waiting for production 9router-api..."

            for i in $(seq 1 20); do
              if docker exec 9router-api node -e \
                "fetch('http://127.0.0.1:20127/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
              then
                echo "9router-api is ready"
                break
              fi

              echo "9router-api not ready yet ($i/20)..."
              sleep 2
            done

            # Final health verification
            docker exec 9router-api node -e \
              "fetch('http://127.0.0.1:20127/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" || {
                echo "ERROR: production 9router-api health check failed"
                docker logs --tail=100 9router-api || true
                exit 1
              }

            echo
            echo "DEPLOY OK"

      - name: Rollback on failure (any prior step failed)
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/9router
            echo "Deployment failed — restoring previous images and cleaning up smoke containers..."
            # 1. Remove smoke containers that the workflow may have left behind
            docker rm -f smoke-9router smoke-api >/dev/null 2>&1 || true
            # 2. Restore previous images (if any) so production keeps running.
            #    Only recreate when :latest actually diverged from :prev — a
            #    failure before the build/pull produced a new image leaves
            #    production untouched and must not trigger an ingress blip.
            #    Works with no registry access: :prev was captured locally.
            NEED_RECREATE=0
            for ref in "${{ env.IMG_9ROUTER }}" "${{ env.IMG_9ROUTER_API }}"; do
              if docker image inspect "$ref:prev" >/dev/null 2>&1; then
                if ! docker image inspect "$ref:latest" >/dev/null 2>&1; then
                  # Pre-cutover / pre-pull failure: production still runs its
                  # current image and no ghcr :latest exists locally.
                  echo "No local $ref:latest yet — production untouched, nothing to restore."
                  continue
                fi
                CUR_ID=$(docker image inspect "$ref:latest" --format '{{.Id}}')
                PREV_ID=$(docker image inspect "$ref:prev" --format '{{.Id}}')
                if [ "$CUR_ID" != "$PREV_ID" ]; then
                  echo "Restoring $ref:prev -> $ref:latest"
                  docker tag "$ref:prev" "$ref:latest"
                  # The failed pull's image is now untagged; drop its body too
                  # (no com.docker.compose.project label on pulled images, so
                  # the label-scoped dangling prune below cannot reclaim it).
                  # Safe: refuses while a container still references it.
                  docker image rm "$CUR_ID" 2>/dev/null || true
                  NEED_RECREATE=1
                fi
              fi
            done
            # 3. Recreate the production stack only if images were restored
            if [ "$NEED_RECREATE" = "1" ]; then
              docker compose --profile dashboard up -d --remove-orphans --force-recreate || {
                echo "ERROR: rollback recreate failed"
                docker compose ps || true
                exit 1
              }
              docker compose ps
              echo "ROLLBACK OK"
            else
              echo "Production already on previous images; nothing to roll back."
            fi

      - name: Prune old images & build cache
        # Runs even when a deploy step failed — the default `if: success()` skipped
        # this exactly when dangling images accumulated (root cause of the 9.6 GB
        # image leak). Must stay AFTER the rollback step: rollback reads `:prev`
        # tags, and this step deletes them.
        if: ${{ !cancelled() }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script: |
            set -e
            IMG_9ROUTER="${{ env.IMG_9ROUTER }}"
            IMG_9ROUTER_API="${{ env.IMG_9ROUTER_API }}"

            # Record the image ids behind `:prev` BEFORE untagging them: re-pointing
            # `:prev` next deploy would orphan these bodies silently, and pulled GHCR
            # images carry no `com.docker.compose.project` label, so the label-scoped
            # dangling prune below can never match them. Deleting by id afterwards is
            # refused by Docker (safe no-op) while the id is still tagged or in use.
            OLD_IDS=""
            for ref in "$IMG_9ROUTER" "$IMG_9ROUTER_API"; do
              id=$(docker image inspect "$ref:prev" --format '{{.Id}}' 2>/dev/null || true)
              [ -n "$id" ] && OLD_IDS="$OLD_IDS $id"
            done

            # Scoped to this project's own image refs — safe on a shared daemon.
            docker rmi "$IMG_9ROUTER:prev" "$IMG_9ROUTER_API:prev" 2>/dev/null || true

            # Smoke-test `:sha-*` tags accumulate locally (one per deploy) — the
            # content they pin is also tagged `:latest`, so dropping them loses
            # nothing. NOTE: `docker image prune` supports only `until=` and
            # `label=` filters — there is NO `reference=` filter. Use
            # `docker image ls --filter reference=` (which supports globs).
            for ref in "$IMG_9ROUTER" "$IMG_9ROUTER_API"; do
              docker image ls --format '{{.Repository}}:{{.Tag}}' \
                --filter "reference=${ref}:sha-*" \
                | xargs -r docker rmi 2>/dev/null || true
            done

            # Pre-cutover compose-built image names (build: era). Refused while a
            # container still uses them (failed first cutover) — safe no-op then.
            docker rmi 9router-9router:latest 9router-9router-api:latest 2>/dev/null || true

            # Now delete the untagged old image bodies recorded above. Still tagged
            # (rollback restored it) or referenced → Docker refuses; `|| true`.
            for id in $OLD_IDS; do
              docker image rm "$id" 2>/dev/null || true
            done

            # Project label scoping keeps co-located stacks (opencode-sandbox) on
            # this shared daemon safe. No `until=24h` floor: freshly built images
            # are <24h old, so the age filter matched nothing and this step
            # reclaimed ~0 bytes on every run (root cause of the dangling leak).
            docker image prune -f \
              --filter "label=com.docker.compose.project=9router"
            # NEVER `docker builder prune -af` on a shared VPS: it evicts the
            # BuildKit cache of every project on the daemon.
            # `--max-used-space 3G` alone is the hard ceiling. Do NOT re-add
            # `--filter "until=72h"`: the age filter restricts pruning to cache
            # older than 72h, so on a deploy-day where all cache is <72h it
            # matches nothing and the cap never bites — cache drifted to ~6GB
            # (measured on the VPS) while nominally "capped" at 3G. The cap alone
            # keeps the most-recent 3G hot (warm deploys, no cold-rebuild OOM)
            # and actually enforces the ceiling. Production no longer builds on
            # the VPS, but preview.yml and manual rebuilds still do — the cap
            # protects those and the co-located stacks.
            # (Was `--keep-storage`; deprecated in Docker CLI 27.5.1, same semantics.)
            docker builder prune -f --max-used-space 3G

      - name: Logout GHCR on VPS
        # Credentials must not outlive the deploy: every job re-logins before
        # its first pull. Failures here never fail an otherwise-green deploy.
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script: |
            docker logout ghcr.io 2>/dev/null || true
