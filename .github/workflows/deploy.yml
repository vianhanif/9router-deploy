name: deploy
on:
  push:
    branches: [ master ]
  repository_dispatch:
    types: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync deploy config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          source: "docker-compose.yml,proxy/Caddyfile"
          target: /opt/9router
      - name: Rebuild & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script: |
            set -e
            cd /opt/9router
            # 9router source is pulled from GitHub master during docker build (see Dockerfile stage 1)
            docker compose pull 9router caddy cloudflared 2>/dev/null || true
            docker compose build 9router-api
            docker compose up -d --remove-orphans
            docker compose ps