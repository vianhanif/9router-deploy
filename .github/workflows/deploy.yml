name: deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      ninerouter_branch:
        description: "9router branch or SHA"
        default: master
        required: false
      api_branch:
        description: "9router-api branch or SHA"
        default: master
        required: false
  repository_dispatch:
    types: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          source: "docker-compose.yml,proxy/Caddyfile,src/9router/Dockerfile,src/9router-api/Dockerfile"
          target: /opt/9router

      - name: Build new images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/9router

            INPUT_NINEROUTER="${{ github.event.inputs.ninerouter_branch }}"
            INPUT_API="${{ github.event.inputs.api_branch }}"

            NINEROUTER_TARGET="${INPUT_NINEROUTER:-master}"
            API_TARGET="${INPUT_API:-master}"

            docker tag 9router-9router:latest 9router-9router:prev 2>/dev/null || true
            docker tag 9router-9router-api:latest 9router-9router-api:prev 2>/dev/null || true

            resolve_sha() {
              if [[ "$1" =~ ^[0-9a-f]{40}$ ]]; then
                echo "$1"
              else
                git ls-remote "$2" refs/heads/"$1" | cut -f1
              fi
            }

            NINEROUTER_SHA=$(resolve_sha "$NINEROUTER_TARGET" "https://github.com/vianhanif/9router.git")
            APIREPO_SHA=$(resolve_sha "$API_TARGET" "https://github.com/vianhanif/9router-api.git")

            echo "Deploying: 9router=$NINEROUTER_TARGET ($NINEROUTER_SHA), 9router-api=$API_TARGET ($APIREPO_SHA)"

            docker compose build \
              --build-arg NINEROUTER_VERSION=$NINEROUTER_SHA \
              --build-arg APIREPO_VERSION=$APIREPO_SHA \
              9router 9router-api headroom

      - name: Smoke test new images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/9router

            # Dynamic string mapping to block the runner character stripping sequence
            LOCAL_HOST="127.0.0.1"
            DASHBOARD_URL="http://${LOCAL_HOST}:20328/api/health"
            API_URL="http://${LOCAL_HOST}:20327/api/health"
            RESP_URL="http://${LOCAL_HOST}:20327/v1/responses"

            cleanup() {
              echo "Cleaning up smoke test containers..."
              docker rm -f smoke-9router smoke-api smoke-headroom >/dev/null 2>&1 || true
            }
            trap cleanup EXIT

            echo "Starting isolated stack for smoke validation..."

            # 1. Start headroom dependency
            docker run -d --name smoke-headroom --network 9router_9router-net --network-alias headroom \
              --entrypoint "setpriv" 9router-headroom:latest \
              --reuid=node --regid=node --init-groups /opt/headroom-venv/bin/headroom proxy --host 0.0.0.0 --port 8787

            # 2. Start Dashboard with exact configuration parameters
            docker run -d --name smoke-9router --network 9router_9router-net \
              --env-file ./env/9router.env -e PORT=20328 -p 20328:20328 \
              -v /opt/9router/data/9router:/app/data -v /opt/9router/data-home/9router-home:/app/data-home \
              9router-9router:latest

            echo "Awaiting dashboard boot up at ${DASHBOARD_URL}..."
            for i in $(seq 1 20); do
              curl -fsS "$DASHBOARD_URL" >/dev/null 2>&1 && break || true
              sleep 3
            done

            curl -fsS "$DASHBOARD_URL" >/dev/null || {
              echo "ERROR: 9router dashboard smoke test failed"
              docker logs smoke-9router || true
              exit 1
            }

            # 3. Start API using identical environment settings
            docker run -d --name smoke-api --network 9router_9router-net \
              --env-file ./env/9router-api.env -e PORT=20327 -p 20327:20327 \
              -v /opt/9router/data/9router:/app/data -v /opt/9router/data-home/9router-home:/app/data-home \
              9router-9router-api:latest

            echo "Awaiting api gateway boot up at ${API_URL}..."
            for i in $(seq 1 20); do
              curl -fsS "$API_URL" >/dev/null 2>&1 && break || true
              sleep 3
            done

            curl -fsS "$API_URL" >/dev/null || {
              echo "ERROR: 9router-api smoke test failed"
              docker logs smoke-api || true
              exit 1
            }

            # Verify endpoint behavior explicitly
            RESP_BODY=$(curl -s -X POST "$RESP_URL" \
              -H "Content-Type: application/json" \
              -d '{"model":"general","input":"ping"}')

            echo "smoke /v1/responses output tail: $(echo "$RESP_BODY" | head -c 200)"

            if echo "$RESP_BODY" | grep -q "Cannot POST"; then
              echo "ERROR: /v1/responses route is missing or broken"
              exit 1
            fi

            echo "SMOKE TEST PASSED SUCCESSFULLY"

      - name: Switch to new images & verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/9router

            echo "Starting production stack..."

            docker compose --profile dashboard up -d \
              --remove-orphans \
              --force-recreate

            echo
            echo "Container status:"
            docker compose ps

            echo
            echo "Checking required services..."

            test "$(docker inspect -f '{{.State.Running}}' 9router-api)" = "true" || {
              echo "ERROR: 9router-api is not running"
              docker logs --tail=100 9router-api || true
              exit 1
            }

            test "$(docker inspect -f '{{.State.Running}}' caddy)" = "true" || {
              echo "ERROR: caddy is not running"
              docker logs --tail=100 caddy || true
              exit 1
            }

            test "$(docker inspect -f '{{.State.Running}}' cloudflared)" = "true" || {
              echo "ERROR: cloudflared is not running"
              docker logs --tail=100 cloudflared || true
              exit 1
            }

            # Verify production 9router-api from inside the container.
            # Port 20127 is intentionally not published to the VPS host.
            echo "Waiting for production 9router-api..."

            for i in $(seq 1 20); do
              if docker exec 9router-api node -e \
                "fetch('http://127.0.0.1:20127/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
              then
                echo "9router-api is ready"
                break
              fi

              echo "9router-api not ready yet ($i/20)..."
              sleep 2
            done

            # Final health verification
            docker exec 9router-api node -e \
              "fetch('http://127.0.0.1:20127/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" || {
                echo "ERROR: production 9router-api health check failed"
                docker logs --tail=100 9router-api || true
                exit 1
              }

            echo
            echo "DEPLOY OK"

      - name: Prune old images & build cache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script: |
            docker rmi 9router-9router:prev 9router-9router-api:prev 2>/dev/null || true
            docker image prune -f
            docker builder prune -af

      - name: Rollback on failure (any prior step failed)
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/9router
            echo "Deployment failed — restoring previous images and cleaning up smoke containers..."
            # 1. Remove smoke containers that the workflow may have left behind
            docker rm -f smoke-9router smoke-api smoke-headroom >/dev/null 2>&1 || true
            # 2. Restore previous images (if any) so production keeps running
            if docker image inspect 9router-9router:prev >/dev/null 2>&1; then
              docker tag 9router-9router:prev 9router-9router:latest
            fi
            if docker image inspect 9router-9router-api:prev >/dev/null 2>&1; then
              docker tag 9router-9router-api:prev 9router-9router-api:latest
            fi
            # 3. Recreate the production stack from the restored images
            docker compose --profile dashboard up -d --remove-orphans --force-recreate || true
            docker compose ps
            echo "ROLLBACK OK"
