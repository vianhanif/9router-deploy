name: cleanup-ghcr-tags

# Retention policy: keep `:latest`, `:prev` and `pr-*` forever; sha-* and test-*
# tags are audit-only and deleted after RETENTION_DAYS. (`test-*` covers the
# :test-ghcr and earlier :test-pr8 validation tags — without the broader prefix
# those never match any deletion rule and linger forever.)
#
# Cost control: private GHCR storage is metered (500 MB free). Retention is
# therefore tight — 2 days, and only the newest KEEP_NEWEST versions survive
# regardless of age, so a burst of pushes cannot blow past the cutoff.
# Correctness never depends on registry history: rollback uses the local
# `:prev` tag on the VPS, not GHCR.
#
# Package paths: images are pushed as `9router-deploy/<name>`, so the REST
# `package_name` segment must be percent-encoded (`9router-deploy%2F9router`).
# The un-encoded `/users/{owner}/packages/container/9router/...` form 404s.
#
# Token: `GITHUB_TOKEN` with `permissions: packages: write` can list and delete
# versions of this repo's own packages. If it is ever rejected (403), swap
# `secrets.GITHUB_TOKEN` for a PAT secret with `delete:packages`.
#
# Triggers: daily schedule + dispatch. The `schedule` entry only fires from the
# DEFAULT branch — GitHub does not run cron on workflows that exist only on a
# feature branch.

on:
  schedule:
    - cron: '0 3 * * *' # daily @ 03:00 UTC — must be <= RETENTION_DAYS, or
    # versions accumulate for a full week before the cutoff can reclaim them.
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Age cutoff in days. Blank = RETENTION_DAYS. 0 purges every currently eligible version.'
        required: false
        type: string

permissions:
  packages: write

env:
  OWNER: vianhanif
  PACKAGE_NAMESPACE: 9router-deploy
  PACKAGES: 9router 9router-api
  RETENTION_DAYS: 2
  KEEP_NEWEST: 2 # always keep the N most recent versions, regardless of age

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RETENTION_DAYS: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail

          # Dispatch may override the cutoff; blank (schedule) falls back to the
          # repo default. 0 is valid and purges the whole eligible backlog.
          days="${INPUT_RETENTION_DAYS:-${RETENTION_DAYS}}"
          [[ "${days}" =~ ^[0-9]+$ ]] || { echo "::error::retention_days must be a non-negative integer, got '${days}'"; exit 1; }

          cutoff=$(date -u -d "-${days} days" +%s)
          echo "retention: ${days} day(s)  cutoff: $(date -u -d "@${cutoff}" -Is)  keep_newest: ${KEEP_NEWEST}"

          total=0
          skipped=0
          : > /tmp/summary.tsv

          for name in $PACKAGES; do
            pkg=$(printf '%s' "${PACKAGE_NAMESPACE}/${name}" | jq -sRr @uri)
            path="/users/${OWNER}/packages/container/${pkg}/versions"
            echo "::group::${PACKAGE_NAMESPACE}/${name} (${pkg})"

            # A missing package is normal (not published yet) → skip. Anything
            # else (401/403/5xx) must fail the run, never silently no-op.
            if ! err=$(gh api --paginate --slurp "$path" 2>&1 >/tmp/versions.json); then
              if grep -q 'HTTP 404' <<<"$err"; then
                echo "package does not exist — skipping"
                printf '%s\tmissing\n' "$name" >> /tmp/summary.tsv
                skipped=$((skipped + 1))
                echo "::endgroup::"
                continue
              fi
              echo "::error::listing versions of ${name} failed (auth/permission or API error):"
              echo "$err"
              echo "::endgroup::"
              exit 1
            fi

            echo "versions: $(jq 'add | length' /tmp/versions.json)"

            # Never delete a version carrying `latest`, `prev`, or a `pr-*` tag.
            # Only consider untagged, `sha-*` (deploy audit tags) or `test-*`
            # (build-test tags) versions, only past the cutoff, and never inside
            # the newest KEEP_NEWEST.
            jq -r --argjson cutoff "$cutoff" --argjson keep "$KEEP_NEWEST" '
              add
              | sort_by(.created_at) | reverse
              | to_entries[]
              | select(.key >= $keep)
              | .value
              | (.metadata.container.tags // []) as $t
              | select($t | any(. == "latest" or . == "prev" or startswith("pr-")) | not)
              | select($t | length == 0 or any(startswith("sha-") or startswith("test-")))
              | select((.created_at | fromdateiso8601) < $cutoff)
              | "\(.id)\t\(.created_at)\t\($t | join(","))"
            ' /tmp/versions.json > /tmp/stale.tsv

            deleted=0
            while IFS=$'\t' read -r id created tags; do
              [ -n "$id" ] || continue
              echo "delete id=$id created=$created tags=${tags:-<untagged>}"
              gh api -X DELETE "${path}/${id}"
              deleted=$((deleted + 1))
              total=$((total + 1))
            done < /tmp/stale.tsv

            printf '%s\t%s\n' "$name" "$deleted" >> /tmp/summary.tsv
            echo "::endgroup::"
          done

          echo "cleanup summary:"
          while IFS=$'\t' read -r name n; do
            printf '  %-14s %s\n' "$name" "$n"
          done < /tmp/summary.tsv
          echo "Deleted ${total} stale version(s); ${skipped} package(s) skipped as missing."
